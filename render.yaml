services:
  - type: web
    name: livros-pcgdigital
    runtime: static
    branch: main
    buildCommand: ""
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
